# Create the Slack app from this manifest:
# api.slack.com/apps -> Create New App -> From a manifest -> paste this.
display_information:
  name: Firebreak
  description: Finds the feature flag behind an incident and kills it after a human approves.
  background_color: "#b42318"
features:
  bot_user:
    display_name: firebreak
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.public
settings:
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
